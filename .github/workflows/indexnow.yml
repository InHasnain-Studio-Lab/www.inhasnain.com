name: IndexNow

# page_build fires once GitHub Pages has published the pushed commit, so the key file is already live.
on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit sitemap URLs
        run: python .github/indexnow.py
